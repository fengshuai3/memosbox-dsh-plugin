packages:
  - '.'

allowBuilds:
  '@memtensor/memos-local-plugin': false
  better-sqlite3: true
  esbuild: true
  # Used only as tree-shaken build input; never run its vulnerable ZIP installer.
  onnxruntime-node: false
  protobufjs: false
  sharp: true

minimumReleaseAgeExclude:
  - '@memtensor/memos-local-plugin@2.0.19'

overrides:
  # No fixed adm-zip release exists as of 2026-09-09. This pin is NOT a fix:
  # the runtime gate and release audit must continue to reject this closure.
  adm-zip: 0.6.0
  ini: 1.3.8
  sharp: 0.35.4
  uuid: 14.0.2
